[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Tek sayfalik uygulama: bilinmeyen yollar index.html'e dusmeli
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker her zaman taze alinsin, yoksa eski surum takili kalir
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
